<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <title>Simon Stender – CV</title>
  <style>
    :root {
      --navy: #2d4057;
      --rust: #ad553b;
      --paper: #f4f0e7;
      --ink: #20242a;
      --muted: #6a7077;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    .bar {
      background: var(--navy);
      color: var(--white);
      padding: 1rem 1.5rem;
    }
    .bar-inner {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .bar a {
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
    }
    main {
      width: min(1100px, calc(100% - 2rem));
      margin: 2rem auto 3rem;
    }
    h1 {
      margin: 0 0 .5rem;
      font-size: clamp(2rem, 4vw, 3.2rem);
      color: var(--navy);
    }
    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .actions {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .button {
      display: inline-block;
      padding: .8rem 1rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
      background: var(--rust);
      color: var(--white);
    }
    .button.secondary {
      background: var(--navy);
    }
    .viewer {
      background: var(--white);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      min-height: 75vh;
    }
    iframe {
      width: 100%;
      height: 80vh;
      border: 0;
      display: block;
    }
    .fallback {
      padding: 1rem;
      font-size: .95rem;
    }
    @media (max-width: 700px) {
      .bar-inner { width: 100%; }
      main { width: min(100% - 1rem, 1100px); margin-top: 1rem; }
      iframe { height: 75vh; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <a href="../">Simon Stender</a>
      <a href="../">Portfolio</a>
    </div>
  </header>

  <main>
    <h1>Curriculum Vitae</h1>
    <p>Simon Rune Stender – Game &amp; Systems Designer</p>

    <div class="actions">
      <a class="button" href="Simon-Stender-CV.pdf" target="_blank" rel="noopener">Open PDF</a>
      <a class="button secondary" href="Simon-Stender-CV.pdf" download>Download PDF</a>
    </div>

    <div class="viewer">
      <iframe src="Simon-Stender-CV.pdf" title="Simon Stender CV">
        <div class="fallback">
          Your browser cannot display PDFs inline.
          <a href="Simon-Stender-CV.pdf">Open the PDF directly.</a>
        </div>
      </iframe>
    </div>
  </main>
</body>
</html>
